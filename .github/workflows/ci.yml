# Continuous Integration — validation only. This workflow never deploys and
# uses no secrets, tokens, or API keys. It runs the same `npm run verify`
# chain (typecheck, lint, Vitest, app build, Functions build) as local dev.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Read-only token so the job cannot push, release, or deploy anything.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Run verification
        run: npm run verify
